<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة وتقارير المصروفات التشغيلية - إدارة الشركة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: none; }
        .header { background: #1e293b; padding: 15px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); flex-wrap: wrap; gap: 10px; }
        h2, h3 { color: #38bdf8; margin: 0; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid #334155; }
        .form-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .form-grid input, .form-grid select { flex: 1; min-width: 180px; padding: 12px; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: #fff; box-sizing: border-box; }
        .btn { border: none; padding: 10px 16px; border-radius: 6px; color: #fff; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-add { background: #0284c7; font-size: 15px; padding: 12px 24px; }
        .btn-add:hover { background: #0369a1; }
        .btn-csv { background: #059669; }
        .btn-csv:hover { background: #047857; }
        .btn-pdf { background: #0284c7; }
        .btn-pdf:hover { background: #0369a1; }
        .btn-back { background: #475569; }
        .btn-back:hover { background: #334155; }
        .btn-edit { background: #d97706; padding: 6px 12px; font-size: 13px; border: none; border-radius: 4px; color: #fff; cursor: pointer; margin-left: 5px; }
        .btn-edit:hover { background: #b45309; }
        .btn-delete { background: #ef4444; padding: 6px 12px; font-size: 13px; border: none; border-radius: 4px; color: #fff; cursor: pointer; }
        .btn-delete:hover { background: #dc2626; }
        .category-badge { background: #334155; color: #e2e8f0; padding: 3px 9px; border-radius: 12px; font-size: 12px; }

        .stats { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box { background: #0f172a; padding: 15px; border-radius: 8px; flex: 1; min-width: 200px; text-align: center; border: 1px solid #334155; }
        .stat-box span { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 5px; }
        .stat-box strong { font-size: 20px; color: #f87171; }

        .filter-container { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-container input, .filter-container select { flex: 1; min-width: 150px; padding: 10px; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: #fff; box-sizing: border-box; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #475569; padding: 10px; text-align: center; font-size: 14px; }
        th { background: #334155; color: #38bdf8; }

        /* نافذة تعديل المصروف */
        .edit-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.85);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .edit-box {
            background: #1e293b;
            border: 2px solid #d97706;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }
        .edit-box label { display: block; font-size: 13px; color: #cbd5e1; margin-top: 10px; }
        .edit-box input, .edit-box select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #475569;
            border-radius: 6px;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
        .modal-actions button { flex: 1; padding: 10px; font-size: 14px; }

        /* نظام الإشعارات العائمة Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 340px;
        }
        .toast {
            padding: 12px 16px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
            animation: fadeInToast 0.25s ease;
            border-right: 4px solid rgba(255, 255, 255, 0.4);
        }
        .toast-success { background: #059669; }
        .toast-error { background: #dc2626; }
        .toast-warning { background: #d97706; }

        @keyframes fadeInToast {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* تنسيق مخصص للطباعة وحفظ PDF */
        @media print {
            body { background: #fff !important; color: #000 !important; padding: 0; display: block !important; }
            .header, .card { background: #fff !important; box-shadow: none !important; border: none !important; padding: 0; }
            .no-print { display: none !important; }
            h2, h3 { color: #000 !important; margin-bottom: 15px; }
            th { background: #f1f5f9 !important; color: #000 !important; border: 1px solid #000; }
            td { color: #000 !important; border: 1px solid #000; }
            .category-badge { background: #e2e8f0 !important; color: #000 !important; }
            .stat-box { background: #f8fafc !important; border: 1px solid #000 !important; }
            .stat-box strong, .stat-box span { color: #000 !important; }
        }
    </style>
</head>
<body>

<div id="toast-container" class="toast-container no-print"></div>

<div class="header">
    <h2>💸 إدارة وتقارير المصروفات التشغيلية</h2>
    <div class="no-print" style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn btn-csv" onclick="downloadExpensesTXT()">تحميل تقرير TXT</button>
        <button class="btn btn-pdf" onclick="window.print()">طباعة / حفظ PDF</button>
        <a href="admin.html" class="btn btn-back">العودة للوحة التحكم</a>
    </div>
</div>

<!-- قسم إضافة مصروف جديد (يختفي عند الطباعة) -->
<div class="card no-print" style="border: 2px solid #0284c7;">
    <h3>تسجيل مصروف جديد</h3>
    <div class="form-grid">
        <input type="text" id="expense-title" placeholder="وصف المصروف (مثال: نقل بضاعة، تغليف، صيانة...)">
        <select id="expense-category">
            <option value="نقل وتوصيل">نقل وتوصيل</option>
            <option value="تغليف وشحن">تغليف وشحن</option>
            <option value="صيانة">صيانة</option>
            <option value="كهرباء وإنترنت">كهرباء وإنترنت</option>
            <option value="متفرقات" selected>متفرقات</option>
        </select>
        <input type="number" id="expense-amount" placeholder="المبلغ (دج)">
        <button class="btn btn-add" onclick="addExpense()">إضافة المصروف ➕</button>
    </div>
</div>

<!-- قسم الإحصائيات والفلترة والجدول -->
<div class="card">
    <div class="stats">
        <div class="stat-box">
            <span>إجمالي المصروفات المعروضة</span>
            <strong id="total-expenses-sum">0 دج</strong>
        </div>
        <div class="stat-box">
            <span>عدد بنود المصروفات</span>
            <strong id="total-expenses-count" style="color: #38bdf8;">0</strong>
        </div>
    </div>

    <div class="filter-container no-print">
        <input type="text" id="search-expense" placeholder="ابحث بوصف المصروف..." onkeyup="filterExpenses()">
        <select id="expense-category-filter" onchange="filterExpenses()">
            <option value="">جميع التصنيفات</option>
            <option value="نقل وتوصيل">نقل وتوصيل</option>
            <option value="تغليف وشحن">تغليف وشحن</option>
            <option value="صيانة">صيانة</option>
            <option value="كهرباء وإنترنت">كهرباء وإنترنت</option>
            <option value="متفرقات">متفرقات</option>
        </select>
        <input type="date" id="exp-date-from" onchange="filterExpenses()" title="من تاريخ">
        <input type="date" id="exp-date-to" onchange="filterExpenses()" title="إلى تاريخ">
    </div>

    <table>
        <thead>
            <tr>
                <th>وصف المصروف</th>
                <th>التصنيف</th>
                <th>المبلغ</th>
                <th>التاريخ والوقت</th>
                <th class="no-print">الإجراءات</th>
            </tr>
        </thead>
        <tbody id="expenses-page-body">
            <tr><td colspan="5" style="color: #94a3b8;">جاري تحميل المصروفات...</td></tr>
        </tbody>
    </table>
</div>

<!-- نافذة تعديل المصروف -->
<div id="edit-expense-modal" class="edit-modal no-print" onclick="closeEditBackdrop(event)">
    <div class="edit-box">
        <h3>✏️ تعديل المصروف</h3>
        <input type="hidden" id="edit-expense-id">
        <label>وصف المصروف</label>
        <input type="text" id="edit-expense-title">
        <label>التصنيف</label>
        <select id="edit-expense-category">
            <option value="نقل وتوصيل">نقل وتوصيل</option>
            <option value="تغليف وشحن">تغليف وشحن</option>
            <option value="صيانة">صيانة</option>
            <option value="كهرباء وإنترنت">كهرباء وإنترنت</option>
            <option value="متفرقات">متفرقات</option>
        </select>
        <label>المبلغ (دج)</label>
        <input type="number" id="edit-expense-amount" min="1">
        <div class="modal-actions">
            <button class="btn btn-csv" onclick="saveEditedExpense()">حفظ التعديل</button>
            <button class="btn btn-back" onclick="closeEditModal()">إلغاء</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://fktettiegkmaijnokrwr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lZ6v_qG8aYXpwLY8VxPNfA_BfT87Jsh';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allExpensesData = [];
    let filteredExpensesData = [];
    let currentUserEmail = '';
    let hasCategoryColumn = true;

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        if (!container) return;

        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.textContent = message;
        container.appendChild(toast);

        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    async function forceKickOut(reason = 'غير مصرح لك بدخول هذه الصفحة أو تم سحب صلاحيتك!') {
        alert(reason);
        await db.auth.signOut();
        window.location.href = 'index.html';
    }

    async function checkCurrentUserRole() {
        const { data: { session } } = await db.auth.getSession();
        if (!session || !session.user || !session.user.email) {
            window.location.href = 'index.html';
            return false;
        }
        currentUserEmail = session.user.email;
        const { data: userData, error } = await db
            .from('users')
            .select('role')
            .eq('email', currentUserEmail)
            .maybeSingle();

        if (error || !userData || userData.role !== 'admin') {
            await forceKickOut('غير مصرح لك بدخول هذه الصفحة أو تم سحب صلاحيتك!');
            return false;
        }
        return true;
    }

    function watchCurrentUserRole() {
        db.channel('expenses-role-watch')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, async (payload) => {
                const changedEmail = payload.new?.email || payload.old?.email;
                if (changedEmail && currentUserEmail && changedEmail.toLowerCase() === currentUserEmail.toLowerCase()) {
                    await checkCurrentUserRole();
                }
            })
            .subscribe();
    }

    async function checkAuth() {
        const isAllowed = await checkCurrentUserRole();
        if (!isAllowed) return;
        document.body.style.display = 'block';
        watchCurrentUserRole();
        await fetchExpenses();
    }

    async function fetchExpenses() {
        const { data, error } = await db.from('costs').select('*').order('created_at', { ascending: false });
        if (error) {
            document.getElementById('expenses-page-body').innerHTML = `<tr><td colspan="5" style="color: #f87171;">خطأ: ${error.message}</td></tr>`;
            return;
        }
        allExpensesData = data || [];
        if (allExpensesData.length > 0 && !('category' in allExpensesData[0])) {
            hasCategoryColumn = false;
        }
        filterExpenses();
    }

    function getExpenseCategory(item) {
        return item.category || 'متفرقات';
    }

    function filterExpenses() {
        const query = document.getElementById('search-expense').value.toLowerCase();
        const selectedCat = document.getElementById('expense-category-filter').value;
        const dateFrom = document.getElementById('exp-date-from').value;
        const dateTo = document.getElementById('exp-date-to').value;

        filteredExpensesData = allExpensesData.filter(item => {
            const matchTitle = (item.title || '').toLowerCase().includes(query);
            const matchCat = selectedCat === '' || getExpenseCategory(item) === selectedCat;
            let matchDate = true;
            if (item.created_at) {
                const itemDate = item.created_at.slice(0, 10);
                if (dateFrom && itemDate < dateFrom) matchDate = false;
                if (dateTo && itemDate > dateTo) matchDate = false;
            }
            return matchTitle && matchCat && matchDate;
        });

        renderExpenses(filteredExpensesData);
    }

    function renderExpenses(data) {
        const tbody = document.getElementById('expenses-page-body');
        tbody.innerHTML = '';
        let totalSum = 0;

        if (data.length > 0) {
            data.forEach(item => {
                const price = Number(item.price) || 0;
                totalSum += price;
                const dateStr = item.created_at ? new Date(item.created_at).toLocaleString('ar-DZ') : '-';
                const catLabel = getExpenseCategory(item);

                tbody.innerHTML += `<tr>
                    <td>${item.title || ''}</td>
                    <td><span class="category-badge">${catLabel}</span></td>
                    <td style="color: #f87171; font-weight: bold;">${price.toLocaleString()} دج</td>
                    <td style="font-size: 12px;">${dateStr}</td>
                    <td class="no-print">
                        <button class="btn-edit" onclick="openEditModal(${item.id})">تعديل</button>
                        <button class="btn-delete" onclick="deleteExpense(${item.id})">حذف</button>
                    </td>
                </tr>`;
            });
        } else {
            tbody.innerHTML = `<tr><td colspan="5" style="color: #94a3b8;">لا توجد مصروفات مطابقة</td></tr>`;
        }

        document.getElementById('total-expenses-sum').textContent = totalSum.toLocaleString() + ' دج';
        document.getElementById('total-expenses-count').textContent = data.length;
    }

    async function addExpense() {
        if (!(await checkCurrentUserRole())) return;
        const title = document.getElementById('expense-title').value.trim();
        const category = document.getElementById('expense-category').value;
        const price = Number(document.getElementById('expense-amount').value);

        if (!title || isNaN(price) || price <= 0) {
            showToast('الرجاء إدخال وصف صحيح للمصروف ومبلغ أكبر من الصفر', 'warning');
            return;
        }

        const payload = hasCategoryColumn ? { title, category, price } : { title, price };
        let { error } = await db.from('costs').insert([payload]);

        if (error && hasCategoryColumn && /category/i.test(error.message)) {
            hasCategoryColumn = false;
            ({ error } = await db.from('costs').insert([{ title, price }]));
        }

        if (error) {
            showToast('فشل حفظ المصروف: ' + error.message, 'error');
        } else {
            showToast('تم تسجيل المصروف بنجاح!', 'success');
            document.getElementById('expense-title').value = '';
            document.getElementById('expense-amount').value = '';
            await fetchExpenses();
        }
    }

    window.openEditModal = function(id) {
        const item = allExpensesData.find(e => e.id === id);
        if (!item) return;

        document.getElementById('edit-expense-id').value = item.id;
        document.getElementById('edit-expense-title').value = item.title || '';
        document.getElementById('edit-expense-category').value = getExpenseCategory(item);
        document.getElementById('edit-expense-amount').value = Number(item.price) || 0;
        document.getElementById('edit-expense-modal').style.display = 'flex';
    };

    window.closeEditModal = function() {
        document.getElementById('edit-expense-modal').style.display = 'none';
    };

    window.closeEditBackdrop = function(event) {
        if (event.target.id === 'edit-expense-modal') {
            closeEditModal();
        }
    };

    window.saveEditedExpense = async function() {
        if (!(await checkCurrentUserRole())) return;
        const id = Number(document.getElementById('edit-expense-id').value);
        const title = document.getElementById('edit-expense-title').value.trim();
        const category = document.getElementById('edit-expense-category').value;
        const price = Number(document.getElementById('edit-expense-amount').value);

        if (!title || isNaN(price) || price <= 0) {
            showToast('الرجاء إدخال وصف صحيح ومبلغ أكبر من الصفر', 'warning');
            return;
        }

        const payload = hasCategoryColumn ? { title, category, price } : { title, price };
        let { error } = await db.from('costs').update(payload).eq('id', id);

        if (error && hasCategoryColumn && /category/i.test(error.message)) {
            hasCategoryColumn = false;
            ({ error } = await db.from('costs').update({ title, price }).eq('id', id));
        }

        if (error) {
            showToast('فشل تعديل المصروف: ' + error.message, 'error');
        } else {
            closeEditModal();
            showToast('تم تحديث بيانات المصروف بنجاح', 'success');
            await fetchExpenses();
        }
    };

    async function deleteExpense(id) {
        if (!(await checkCurrentUserRole())) return;
        if (confirm('هل أنت متأكد من حذف هذا المصروف؟')) {
            const { error } = await db.from('costs').delete().eq('id', id);
            if (error) showToast('فشل الحذف: ' + error.message, 'error');
            else {
                showToast('تم حذف المصروف بنجاح', 'success');
                await fetchExpenses();
            }
        }
    }

    function downloadExpensesTXT() {
        if (filteredExpensesData.length === 0) {
            showToast('لا توجد بيانات لتحميلها!', 'warning');
            return;
        }

        let content = "=== تقرير المصروفات التشغيلية ===\n";
        content += "تاريخ الاستخراج: " + new Date().toLocaleString('ar-DZ') + "\n";
        content += "=========================================\n\n";

        let sum = 0;
        filteredExpensesData.forEach((item, index) => {
            const price = Number(item.price) || 0;
            sum += price;
            const dateStr = item.created_at ? new Date(item.created_at).toLocaleString('ar-DZ') : '-';
            const catLabel = getExpenseCategory(item);
            content += `${index + 1}. البيان: ${item.title} | التصنيف: ${catLabel} | المبلغ: ${price.toLocaleString()} دج | التاريخ: ${dateStr}\n`;
        });

        content += "\n=========================================\n";
        content += `إجمالي المصروفات في هذا التقرير: ${sum.toLocaleString()} دج\n`;

        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `تقرير_المصروفات_${new Date().toISOString().slice(0,10)}.txt`;
        link.click();
        showToast('تم تحميل تقرير المصروفات بنجاح', 'success');
    }

    db.channel('costs-page-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'costs' }, () => {
        fetchExpenses();
    }).subscribe();

    checkAuth();
</script>
</body>
</html>
