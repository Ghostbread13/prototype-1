<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المبيعات والتقارير المتقدمة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: none; }
        .header { background: #1e293b; padding: 15px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); flex-wrap: wrap; gap: 10px; }
        h2, h3 { color: #38bdf8; margin: 0; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .actions-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .btn { border: none; padding: 10px 16px; border-radius: 6px; color: #fff; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-back { background: #475569; }
        .btn-csv { background: #059669; }
        .btn-pdf { background: #0284c7; }
        .filter-container { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input, select { flex: 1; min-width: 150px; padding: 10px; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: #fff; box-sizing: border-box; }
        .stats { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box { background: #0f172a; padding: 15px; border-radius: 8px; flex: 1; min-width: 180px; text-align: center; border: 1px solid #334155; }
        .stat-box span { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 5px; }
        .stat-box strong { font-size: 20px; color: #4ade80; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #475569; padding: 10px; text-align: center; font-size: 14px; }
        th { background: #334155; color: #38bdf8; }
        @media print {
            body { background: #fff !important; color: #000 !important; padding: 0; display: block !important; }
            .no-print { display: none !important; }
            th { background: #f1f5f9 !important; color: #000 !important; border: 1px solid #000; }
            td { color: #000 !important; border: 1px solid #000; }
            .stat-box { background: #f8fafc !important; border: 1px solid #000 !important; }
            .stat-box strong, .stat-box span { color: #000 !important; }
        }
    </style>
</head>
<body>

<div class="header">
    <h2>سجل المبيعات والتقارير المتقدمة</h2>
    <div class="actions-bar no-print" style="margin: 0;">
        <button class="btn btn-csv" onclick="downloadTXT()">تحميل تقارير TXT</button>
        <button class="btn btn-pdf" onclick="window.print()">طباعة / PDF</button>
        <button class="btn btn-back" onclick="history.back()">الرجوع</button>
    </div>
</div>

<div class="card">
    <div class="stats">
        <div class="stat-box">
            <span>إجمالي المداخيل المعروضة</span>
            <strong id="total-revenue">0 دج</strong>
        </div>
        <div class="stat-box">
            <span>إجمالي أرباح المبيعات (قبل المصروفات)</span>
            <strong id="total-gross-profit" style="color: #facc15;">0 دج</strong>
        </div>
        <div class="stat-box">
            <span>عدد عمليات البيع</span>
            <strong id="total-count" style="color: #38bdf8;">0</strong>
        </div>
    </div>

    <!-- فلترة متقدمة تشمل التواريخ -->
    <div class="filter-container no-print">
        <input type="text" id="search-sales" placeholder="ابحث بالقطعة أو إيميل العامل..." onkeyup="filterSales()">
        <select id="branch-sales-filter" onchange="filterSales()">
            <option value="">جميع الفروع</option>
        </select>
        <input type="date" id="date-from" onchange="filterSales()" title="من تاريخ">
        <input type="date" id="date-to" onchange="filterSales()" title="إلى تاريخ">
    </div>

    <table>
        <thead>
            <tr>
                <th>القطعة</th>
                <th>الفرع</th>
                <th>الكمية</th>
                <th>المبلغ</th>
                <th>الربح التقريبي</th>
                <th>البائع</th>
                <th>التاريخ والوقت</th>
            </tr>
        </thead>
        <tbody id="sales-table-body">
            <tr><td colspan="7" style="color: #94a3b8;">جاري تحميل سجل المبيعات...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const SUPABASE_URL = 'https://fktettiegkmaijnokrwr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lZ6v_qG8aYXpwLY8VxPNfA_BfT87Jsh';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allSalesData = [];
    let inventoryBuyingMap = {};
    let currentFilteredData = [];
    let currentUserEmail = '';

    async function forceKickOut(reason = 'غير مصرح لك بدخول هذه الصفحة أو تم سحب صلاحيتك!') {
        alert(reason);
        await db.auth.signOut();
        window.location.href = 'index.html';
    }

    async function checkCurrentUserRole() {
        const { data: { session } } = await db.auth.getSession();
        if (!session || !session.user || !session.user.email) {
            window.location.href = 'index.html';
            return false;
        }
        currentUserEmail = session.user.email;
        const { data: userData, error } = await db
            .from('users')
            .select('role')
            .eq('email', currentUserEmail)
            .maybeSingle();

        if (error || !userData || !['admin', 'boss', 'worker'].includes(userData.role)) {
            await forceKickOut('غير مصرح لك بدخول هذه الصفحة أو تم سحب صلاحيتك!');
            return false;
        }
        return true;
    }

    function watchCurrentUserRole() {
        db.channel('sales-role-watch')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, async (payload) => {
                const changedEmail = payload.new?.email || payload.old?.email;
                if (changedEmail && currentUserEmail && changedEmail.toLowerCase() === currentUserEmail.toLowerCase()) {
                    await checkCurrentUserRole();
                }
            })
            .subscribe();
    }

    async function initPage() {
        const isAllowed = await checkCurrentUserRole();
        if (!isAllowed) return;
        document.body.style.display = 'block';
        watchCurrentUserRole();
        await fetchSales();
    }

    async function fetchInventoryBuyingPrices() {
        const { data, error } = await db.from('inventory').select('name, branch, buying_price');
        if (error || !data) return;

        const map = {};
        data.forEach(item => {
            const nameKey = (item.name || '').trim().toLowerCase();
            const branchKey = (item.branch || '').trim().toLowerCase();
            const buy = Number(item.buying_price) || 0;
            if (nameKey) {
                map[`${nameKey}||${branchKey}`] = buy;
                if (!(nameKey in map)) {
                    map[nameKey] = buy;
                }
            }
        });
        inventoryBuyingMap = map;
    }

    function calculateSaleProfit(sale) {
        const rev = Number(sale.total_price) || 0;
        const qty = Number(sale.quantity_sold) || 0;
        const nameKey = (sale.item_name || '').trim().toLowerCase();
        const branchKey = (sale.branch || '').trim().toLowerCase();

        const buyPrice = `${nameKey}||${branchKey}` in inventoryBuyingMap
            ? inventoryBuyingMap[`${nameKey}||${branchKey}`]
            : (inventoryBuyingMap[nameKey] ?? 0);

        return rev - (buyPrice * qty);
    }

    async function fetchSales() {
        await fetchInventoryBuyingPrices();
        const { data, error } = await db.from('sales').select('*').order('created_at', { ascending: false });
        if (error) return;
        allSalesData = data || [];
        populateBranches();
        filterSales();
    }

    function populateBranches() {
        const select = document.getElementById('branch-sales-filter');
        const currentVal = select.value;
        const branches = [...new Set(allSalesData.map(s => s.branch))].filter(Boolean);
        select.innerHTML = '<option value="">جميع الفروع</option>';
        branches.forEach(b => select.innerHTML += `<option value="${b}">${b}</option>`);
        select.value = currentVal;
    }

    function renderSales(data) {
        const tbody = document.getElementById('sales-table-body');
        tbody.innerHTML = '';
        let totalRev = 0;
        let totalProfit = 0;

        if (data.length > 0) {
            data.forEach(sale => {
                const price = Number(sale.total_price) || 0;
                const profit = calculateSaleProfit(sale);
                totalRev += price;
                totalProfit += profit;
                const dateStr = sale.created_at ? new Date(sale.created_at).toLocaleString('ar-DZ') : '-';
                const profitColor = profit >= 0 ? '#facc15' : '#f87171';

                tbody.innerHTML += `<tr>
                    <td>${sale.item_name || ''}</td>
                    <td>${sale.branch || '-'}</td>
                    <td>${Number(sale.quantity_sold || 0).toLocaleString()}</td>
                    <td style="color: #4ade80; font-weight: bold;">${price.toLocaleString()} دج</td>
                    <td style="color: ${profitColor}; font-weight: bold;">${profit.toLocaleString()} دج</td>
                    <td>${sale.worker_email || '-'}</td>
                    <td style="font-size: 12px;">${dateStr}</td>
                </tr>`;
            });
        } else {
            tbody.innerHTML = `<tr><td colspan="7" style="color: #94a3b8;">لا توجد مبيعات مطابقة</td></tr>`;
        }
        document.getElementById('total-revenue').textContent = totalRev.toLocaleString() + ' دج';
        document.getElementById('total-gross-profit').textContent = totalProfit.toLocaleString() + ' دج';
        document.getElementById('total-count').textContent = data.length;
    }

    function filterSales() {
        const query = document.getElementById('search-sales').value.toLowerCase();
        const branch = document.getElementById('branch-sales-filter').value;
        const dateFrom = document.getElementById('date-from').value;
        const dateTo = document.getElementById('date-to').value;

        currentFilteredData = allSalesData.filter(s => {
            const matchText = (s.item_name || '').toLowerCase().includes(query) || (s.worker_email || '').toLowerCase().includes(query);
            const matchBranch = branch === '' || s.branch === branch;

            let matchDate = true;
            if (s.created_at) {
                const saleDate = s.created_at.slice(0, 10);
                if (dateFrom && saleDate < dateFrom) matchDate = false;
                if (dateTo && saleDate > dateTo) matchDate = false;
            }
            return matchText && matchBranch && matchDate;
        });

        renderSales(currentFilteredData);
    }

    function downloadTXT() {
        if (currentFilteredData.length === 0) { alert('لا توجد بيانات لتحميلها!'); return; }
        let content = "=== تقرير المبيعات المتقدم ===\n\n";
        let sum = 0;
        let profitSum = 0;
        currentFilteredData.forEach((s, i) => {
            const price = Number(s.total_price) || 0;
            const profit = calculateSaleProfit(s);
            sum += price;
            profitSum += profit;
            content += `${i + 1}. قطعة: ${s.item_name} | الفرع: ${s.branch} | الكمية: ${s.quantity_sold} | المبلغ: ${price.toLocaleString()} دج | الربح: ${profit.toLocaleString()} دج | البائع: ${s.worker_email} | التاريخ: ${s.created_at}\n`;
        });
        content += `\nالإجمالي الكلي: ${sum.toLocaleString()} دج\n`;
        content += `إجمالي الأرباح التقريبية: ${profitSum.toLocaleString()} دج\n`;
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `تقرير_المبيعات_${new Date().toISOString().slice(0,10)}.txt`;
        link.click();
    }

    db.channel('sales-realtime-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'sales' }, () => {
            fetchSales();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory' }, () => {
            fetchSales();
        })
        .subscribe();

    initPage();
</script>
</body>
</html>
