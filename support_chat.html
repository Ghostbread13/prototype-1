<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التواصل مع المسؤول - نظام إدارة الشركة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .chat-card { background: #1e293b; width: 100%; max-width: 540px; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); border: 1px solid #334155; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
        h2 { margin: 0; color: #38bdf8; font-size: 18px; }
        .back-link { background: #475569; color: #fff; text-decoration: none; padding: 7px 14px; border-radius: 6px; font-size: 13px; }
        .back-link:hover { background: #334155; }
        .email-row { display: flex; gap: 8px; margin-bottom: 12px; }
        input, textarea { width: 100%; padding: 11px; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: #fff; box-sizing: border-box; font-family: Tahoma, sans-serif; }
        .messages-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px;
            height: 290px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }
        .msg { max-width: 82%; padding: 10px 13px; border-radius: 10px; font-size: 13px; line-height: 1.6; word-wrap: break-word; }
        .msg-user { align-self: flex-start; background: #0284c7; color: #fff; }
        .msg-admin { align-self: flex-end; background: #059669; color: #fff; }
        .blocked-banner {
            display: none;
            background: rgba(220, 38, 38, 0.18);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .send-row { display: flex; gap: 8px; }
        .send-btn { background: #7c3aed; border: none; color: #fff; padding: 0 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .send-btn:hover:not(:disabled) { background: #6d28d9; }
        .send-btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; }
        .status-note { font-size: 12px; color: #94a3b8; margin-top: 8px; text-align: center; }
    </style>
</head>
<body>

<div class="chat-card">
    <div class="chat-header">
        <h2>💬 التواصل مع المسؤول</h2>
        <a href="index.html" class="back-link">العودة لتسجيل الدخول</a>
    </div>

    <div class="email-row">
        <input type="email" id="chat-email" placeholder="أدخل بريدك الإلكتروني المسجل..." onchange="loadChatForEmail()">
        <button class="send-btn" style="padding: 10px 14px;" onclick="loadChatForEmail()">فتح</button>
    </div>

    <div id="messages-box" class="messages-box">
        <div style="color: #94a3b8; text-align: center; margin: auto; font-size: 13px;">
            أدخل بريدك الإلكتروني لعرض المحادثة وإرسال رسالتك للمسؤول.
        </div>
    </div>

    <div id="blocked-banner" class="blocked-banner">
        ⛔ تم إيقاف ميزة التواصل المباشر مع المسؤول لهذا الحساب من قِبل الإدارة.
    </div>

    <div class="send-row">
        <textarea id="chat-input" rows="2" placeholder="اكتب شرح المشكلة (إيقاف مؤقت، حذف بالخطأ، طلب صلاحية...)"></textarea>
        <button id="send-btn" class="send-btn" onclick="sendUserMessage()">إرسال</button>
    </div>
    <div id="status-note" class="status-note"></div>
</div>

<script>
    const SUPABASE_URL = 'https://fktettiegkmaijnokrwr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lZ6v_qG8aYXpwLY8VxPNfA_BfT87Jsh';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeEmail = '';
    let isChatBlocked = false;
    let currentChatPayload = { blocked: false, messages: [] };

    function getNormalizedEmail() {
        return document.getElementById('chat-email').value.trim().toLowerCase();
    }

    function setChatBlockedState(blocked) {
        isChatBlocked = blocked;
        document.getElementById('blocked-banner').style.display = blocked ? 'block' : 'none';
        document.getElementById('chat-input').disabled = blocked;
        document.getElementById('send-btn').disabled = blocked;
    }

    function parseChatBlob(raw) {
        if (!raw) return { blocked: false, messages: [] };
        try {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object') {
                return {
                    blocked: Boolean(parsed.blocked),
                    messages: Array.isArray(parsed.messages) ? parsed.messages : []
                };
            }
        } catch (_) {}
        return {
            blocked: false,
            messages: [{ sender: 'user', text: String(raw), time: '' }]
        };
    }

    function escapeHtml(text) {
        return String(text || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    async function loadChatForEmail() {
        const email = getNormalizedEmail();
        const box = document.getElementById('messages-box');
        const note = document.getElementById('status-note');

        if (!email) {
            box.innerHTML = `<div style="color: #94a3b8; text-align: center; margin: auto; font-size: 13px;">أدخل بريدك الإلكتروني أولاً.</div>`;
            setChatBlockedState(false);
            return;
        }

        activeEmail = email;
        const { data, error } = await db
            .from('users')
            .select('email, chat_data')
            .ilike('email', email)
            .maybeSingle();

        if (error) {
            box.innerHTML = `<div style="color: #f87171; text-align: center; margin: auto; font-size: 13px;">تعذر قراءة بيانات الحساب من جدول users.</div>`;
            note.textContent = 'تأكد من وجود عمود chat_data (نوع text) في جدول users.';
            return;
        }

        if (!data) {
            box.innerHTML = `<div style="color: #f87171; text-align: center; margin: auto; font-size: 13px;">هذا البريد غير موجود في جدول users حالياً.</div>`;
            note.textContent = '';
            return;
        }

        note.textContent = '';
        currentChatPayload = parseChatBlob(data.chat_data);
        setChatBlockedState(currentChatPayload.blocked);

        box.innerHTML = '';
        if (currentChatPayload.messages.length === 0) {
            box.innerHTML = `<div style="color: #94a3b8; text-align: center; margin: auto; font-size: 13px;">لا توجد رسائل بعد. اكتب مشكلتك ليطلع عليها المسؤول.</div>`;
            return;
        }

        currentChatPayload.messages.forEach(msg => {
            const isAdmin = msg.sender === 'admin';
            box.innerHTML += `
                <div class="msg ${isAdmin ? 'msg-admin' : 'msg-user'}">
                    <div>${isAdmin ? '🛡️ المسؤول: ' : ''}${escapeHtml(msg.text)}</div>
                </div>
            `;
        });
        box.scrollTop = box.scrollHeight;
    }

    window.sendUserMessage = async function() {
        if (isChatBlocked) return;
        const email = getNormalizedEmail();
        const input = document.getElementById('chat-input');
        const text = input.value.trim();

        if (!email) {
            alert('الرجاء إدخال البريد الإلكتروني أولاً.');
            return;
        }
        if (!text) return;

        const nextPayload = {
            blocked: currentChatPayload.blocked,
            messages: [
                ...currentChatPayload.messages,
                { sender: 'user', text, time: new Date().toISOString() }
            ]
        };

        const { error } = await db
            .from('users')
            .update({ chat_data: JSON.stringify(nextPayload) })
            .ilike('email', email);

        if (error) {
            alert('تعذر إرسال الرسالة: ' + error.message);
            return;
        }

        input.value = '';
        await loadChatForEmail();
    };

    db.channel('support-chat-users-watch')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, (payload) => {
            const rowEmail = (payload.new?.email || payload.old?.email || '').toLowerCase();
            if (activeEmail && rowEmail === activeEmail) {
                loadChatForEmail();
            }
        })
        .subscribe();

    (function initFromQuery() {
        const params = new URLSearchParams(window.location.search);
        const qEmail = params.get('email');
        if (qEmail) {
            document.getElementById('chat-email').value = qEmail;
            loadChatForEmail();
        }
    })();
</script>
</body>
</html>
