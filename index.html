<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة الشركة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
        .login-card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0284c7; border: none; border-radius: 6px; color: #fff; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover:not(:disabled) { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #error-msg { color: #f87171; text-align: center; margin-top: 12px; font-size: 14px; line-height: 1.6; }
        #support-box { display: none; text-align: center; margin-top: 14px; }
        .support-link {
            display: inline-block;
            background: #7c3aed;
            color: #fff;
            text-decoration: none;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
        }
        .support-link:hover { background: #6d28d9; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>تسجيل الدخول</h2>
    <input type="email" id="email" placeholder="البريد الإلكتروني" required>
    <input type="password" id="password" placeholder="كلمة المرور" required>
    <button id="login-btn" onclick="handleLogin()">دخول للنظام</button>
    <div id="error-msg"></div>
    <div id="support-box">
        <a id="support-link-btn" href="support_chat.html" class="support-link">💬 تواصل مع المسؤول أو الدعم</a>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://fktettiegkmaijnokrwr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lZ6v_qG8aYXpwLY8VxPNfA_BfT87Jsh';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const roleRoutes = {
        admin: 'admin.html',
        boss: 'investor.html',
        worker: 'worker.html'
    };

    function setError(msg, showSupport = false, userEmail = '') {
        document.getElementById('error-msg').textContent = msg;
        const supportBox = document.getElementById('support-box');
        const supportLink = document.getElementById('support-link-btn');

        if (showSupport) {
            const targetEmail = userEmail || document.getElementById('email').value.trim();
            supportLink.href = targetEmail
                ? `support_chat.html?email=${encodeURIComponent(targetEmail)}`
                : 'support_chat.html';
            supportBox.style.display = 'block';
        } else {
            supportBox.style.display = 'none';
        }
    }

    async function redirectByRole(email) {
        const { data: userData, error } = await db
            .from('users')
            .select('role')
            .eq('email', email)
            .maybeSingle();

        if (error) {
            await db.auth.signOut();
            setError('تعذر التحقق من صلاحية الحساب حالياً، حاول مرة أخرى.', true, email);
            return false;
        }

        if (!userData) {
            await db.auth.signOut();
            setError('الحساب موجود في نظام الدخول ولكن لم تُمنح له صلاحية في جدول المستخدمين بعد.', true, email);
            return false;
        }

        if (userData.role === 'suspended') {
            await db.auth.signOut();
            setError('تم إيقاف هذا الحساب مؤقتاً من قِبل الإدارة.', true, email);
            return false;
        }

        if (!roleRoutes[userData.role]) {
            await db.auth.signOut();
            setError('حسابك لا يملك صلاحية مفعّلة في النظام أو تم سحبها.', true, email);
            return false;
        }

        window.location.href = roleRoutes[userData.role];
        return true;
    }

    window.handleLogin = async function() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('login-btn');

        setError('', false);
        if (!email || !password) {
            setError('الرجاء إدخال البريد الإلكتروني وكلمة المرور.', false);
            return;
        }

        btn.disabled = true;
        btn.textContent = 'جاري التحقق...';

        const { data, error } = await db.auth.signInWithPassword({ email, password });
        if (error || !data.user) {
            btn.disabled = false;
            btn.textContent = 'دخول للنظام';
            setError('البريد الإلكتروني أو كلمة المرور غير صحيحة.', false);
            return;
        }

        const redirected = await redirectByRole(data.user.email);
        if (!redirected) {
            btn.disabled = false;
            btn.textContent = 'دخول للنظام';
        }
    };

    (async function checkExistingSession() {
        const { data: { session } } = await db.auth.getSession();
        if (session && session.user && session.user.email) {
            await redirectByRole(session.user.email);
        }
    })();
</script>
</body>
</html>
