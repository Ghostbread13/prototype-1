
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المحرر - إدارة الشركة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .header { background: #1e293b; padding: 15px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2, h3 { color: #38bdf8; margin: 0; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #0284c7; border: none; padding: 12px 20px; border-radius: 6px; color: #fff; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background: #0369a1; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #475569; padding: 10px; text-align: center; font-size: 14px; }
        th { background: #334155; color: #38bdf8; }
        .logout-btn { background: #ef4444; width: auto; padding: 8px 15px; font-size: 14px; margin: 0; }
        .btn-delete { background: #ef4444; padding: 6px 12px; font-size: 13px; width: auto; margin: 0; }
        .btn-delete:hover { background: #dc2626; }
        .btn-edit { background: #d97706; padding: 6px 12px; font-size: 13px; width: auto; margin: 0; margin-left: 5px; }
        .btn-edit:hover { background: #b45309; }
        .filter-container { display: flex; gap: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="header">
    <h2>لوحة تحكم المحرر (Admin)</h2>
    <div style="display: flex; gap: 10px; align-items: center;">
        
        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>
</div>

  
<!-- إدارة رأس المال -->
<div class="card">
    <h3>إدارة إجمالي رأس المال</h3>
    <input type="number" id="capital-input" placeholder="أدخل مبلغ رأس المال الكلي (دج)">
    <button onclick="updateCapital()" style="background: #059669;">حفظ وتحديث رأس المال للسحابة</button>
</div>

<!-- إضافة قطعة جديدة للمخزون -->
<div class="card">
    <h3>إضافة قطعة / منتج جديد للمخزون</h3>
    <input type="text" id="item-name" placeholder="اسم القطعة أو المنتج">
    <input type="text" id="item-branch" placeholder="اكتب اسم الفرع يدوياً (مثال: Temu، الفرع 1...)">
    <input type="number" id="buying-price" placeholder="سعر الشراء (دج)">
    <input type="number" id="selling-price" placeholder="سعر البيع المتوقع (دج)">
    <input type="number" id="quantity" placeholder="الكمية المتوفرة">
    <button onclick="addInventoryItem()">حفظ وإضافة للمخزون</button>
</div>

<div class="card">
    <h3>مخزون الفروع</h3>
    
    <!-- شريط البحث والفلترة -->
    <div class="filter-container">
        <input type="text" id="search-input" placeholder="ابحث باسم القطعة..." onkeyup="filterTable()">
        <select id="branch-filter" onchange="filterTable()">
            <option value="">جميع الفروع</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>القطعة</th>
                <th>الفرع</th>
                <th>الشراء</th>
                <th>البيع</th>
                <th>الكمية</th>
                <th>الإجراءات</th>
            </tr>
        </thead>
        <tbody id="inventory-table-body">
            <!-- سيتم تعبئة البيانات برمجياً -->
        </tbody>
    </table>
</div>

<script>
    const SUPABASE_URL = 'https://fktettiegkmaijnokrwr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lZ6v_qG8aYXpwLY8VxPNfA_BfT87Jsh';

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allInventoryData = []; // لتخزين البيانات مؤقتاً للبحث السريع

    async function fetchInventory() {
        const { data, error } = await db.from('inventory').select('*').order('id', { ascending: true });
        
        if (error) {
            console.error("خطأ في جلب المخزون:", error.message);
            return;
        }

        allInventoryData = data || [];
        populateBranchDropdown();
        renderTable(allInventoryData);
    }

    // تعبئة قائمة الفروع المتاحة في الـ Select تلقائياً
    function populateBranchDropdown() {
        const branchSelect = document.getElementById('branch-filter');
        const currentSelected = branchSelect.value;
        
        // استخراج الفروع الفريدة بدون تكرار
        const branches = [...new Set(allInventoryData.map(item => item.branch))].filter(Boolean);
        
        branchSelect.innerHTML = '<option value="">جميع الفروع</option>';
        branches.forEach(branch => {
            branchSelect.innerHTML += `<option value="${branch}">${branch}</option>`;
        });
        
        branchSelect.value = currentSelected;
    }

    // عرض البيانات في الجدول
    function renderTable(data) {
        const tbody = document.getElementById('inventory-table-body');
        tbody.innerHTML = '';

        if (data && data.length > 0) {
            data.forEach(item => {
                const row = `<tr>
                    <td>${item.name || ''}</td>
                    <td>${item.branch || '-'}</td>
                    <td>${item.buying_price || 0} دج</td>
                    <td>${item.selling_price || 0} دج</td>
                    <td>${item.quantity || 0}</td>
                    <td>
                        <button class="btn-edit" onclick="editItem(${item.id}, '${item.name}', ${item.quantity}, ${item.selling_price})">تعديل</button>
                        <button class="btn-delete" onclick="deleteItem(${item.id}, '${item.name}')">حذف</button>
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });
        } else {
            tbody.innerHTML = `<tr><td colspan="6" style="color: #94a3b8;">لا توجد تطابق للبحث حالياً</td></tr>`;
        }
    }

    // تصفية الجدول بناءً على البحث والفرع
    function filterTable() {
        const searchQuery = document.getElementById('search-input').value.toLowerCase();
        const selectedBranch = document.getElementById('branch-filter').value;

        const filtered = allInventoryData.filter(item => {
            const matchesName = (item.name || '').toLowerCase().includes(searchQuery);
            const matchesBranch = selectedBranch === "" || item.branch === selectedBranch;
            return matchesName && matchesBranch;
        });

        renderTable(filtered);
    }

    async function updateCapital() {
        const capitalValue = parseFloat(document.getElementById('capital-input').value);
        
        if (isNaN(capitalValue) || capitalValue < 0) {
            alert('الرجاء إدخال مبلغ صحيح لرأس المال');
            return;
        }

        const { error } = await db
            .from('settings')
            .update({ value: capitalValue })
            .eq('key', '1');

        if (error) {
            alert('فشل حفظ رأس المال في السحابة: ' + error.message);
        } else {
            alert('تم حفظ وتحديث رأس المال بنجاح!');
        }
    }

    window.addInventoryItem = async function() {
        const name = document.getElementById('item-name').value.trim();
        const branch = document.getElementById('item-branch').value.trim();
        const buying_price = Number(document.getElementById('buying-price').value) || 0;
        const selling_price = Number(document.getElementById('selling-price').value) || 0;
        const quantity = Number(document.getElementById('quantity').value) || 0;

        if (!name || !branch) {
            alert("الرجاء إدخال اسم القطعة واسم الفرع");
            return;
        }

        const { error } = await db.from('inventory').insert([{
            name: name,
            branch: branch,
            buying_price: buying_price,
            selling_price: selling_price,
            quantity: quantity
        }]);

        if (error) {
            alert("خطأ Supabase: " + error.message);
        } else {
            alert("تمت الإضافة بنجاح!");
            document.getElementById('item-name').value = '';
            document.getElementById('item-branch').value = '';
            document.getElementById('buying-price').value = '';
            document.getElementById('selling-price').value = '';
            document.getElementById('quantity').value = '';
            fetchInventory();
        }
    };

    window.deleteItem = async function(id, name) {
        if (confirm(`هل أنت متأكد من حذف المنتج "${name}" من المخزون؟`)) {
            const { error } = await db.from('inventory').delete().eq('id', id);
            if (error) {
                alert("فشل الحذف: " + error.message);
            } else {
                alert("تم حذف المنتج بنجاح");
                fetchInventory();
            }
        }
    };

    window.editItem = async function(id, name, oldQty, oldPrice) {
        const newQty = prompt(`تعديل الكمية الجديدة لـ "${name}":`, oldQty);
        if (newQty === null) return;
        
        const newPrice = prompt(`تعديل سعر البيع لـ "${name}":`, oldPrice);
        if (newPrice === null) return;

        const { error } = await db.from('inventory').update({
            quantity: Number(newQty),
            selling_price: Number(newPrice)
        }).eq('id', id);

        if (error) {
            alert("فشل التعديل: " + error.message);
        } else {
            alert("تم تحديث المنتج بنجاح!");
            fetchInventory();
        }
    };

    window.logout = async function() {
        await db.auth.signOut();
        window.location.href = 'index.html';
    };

    fetchInventory();
</script>

</body>
</html>
